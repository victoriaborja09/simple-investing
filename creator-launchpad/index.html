function gameRow(c){const g=getGame(c.gameId);const count=allFor(c.id).length;return `<tr><td><div class="game-inline">${gameArt(g,true)}<div><strong>${esc(c.title)}</strong><small>${esc(g.name)} · ${esc(c.objective)}</small></div></div></td><td><span class="pill green">Active</span></td><td>${count} / ${c.slots}</td><td class="mono">${money(c.reward)}</td><td><button class="btn white sm" data-nav="campaign" data-id="${c.id}">Review ${ico('chevron',12)}</button></td></tr>`}
function overview(){const committed=state.campaigns.reduce((a,c)=>a+totalCost(c),0),approvedNum=state.assignments.filter(a=>a.status==='approved').length,pending=state.assignments.filter(a=>a.status==='submitted').length;return `<div class="hero"><div class="hero-copy"><div class="kicker">YOUR CREATOR WORKSPACE</div><h1>Launch your next<br>playtest.</h1><p>Find players for targeted tests, reward useful feedback in Robux, and improve your experience before investing in distribution.</p><button class="btn primary" data-nav="create">${ico('plus')} Create a playtest ${ico('arrow')}</button></div><div class="hero-figure"><div class="fig-main">▣</div><div class="fig-small">◈</div></div></div><div class="steps"><div class="step"><div class="step-num">01</div><div><strong>Validate</strong><span>Hear from real players</span></div></div>${ico('chevron',15).replace('<svg','<svg class="step-arrow"')}<div class="step"><div class="step-num">02</div><div><strong>Improve</strong><span>Prioritize friction points</span></div></div>${ico('chevron',15).replace('<svg','<svg class="step-arrow"')}<div class="step"><div class="step-num">03</div><div><strong>Grow</strong><span>Promote when ready</span></div></div></div><div class="grid-4" style="margin-bottom:24px">${[['Active playtests',state.campaigns.length,'clipboard','Developer-funded assignments'],['Verified contributions',approvedNum,'check','Approved feedback reports'],['Awaiting review',pending,'clock','Submissions ready for review'],['Committed budget',money(committed),'wallet','Rewards + illustrative fee']].map(([k,v,i,n])=>`<div class="card metric"><div class="metric-icon">${ico(i)}</div><div class="metric-label">${k}</div><div class="metric-value">${v}</div><div class="metric-detail">${n}</div></div>`).join('')}</div><div class="split"><div class="card"><div class="card-head"><h3>Active playtests</h3><button class="btn ghost sm" data-nav="campaigns">View all ${ico('arrow',13)}</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Assignment</th><th>Status</th><th>Filled</th><th>Reward</th><th></th></tr></thead><tbody>${state.campaigns.slice(0,5).map(gameRow).join('')}</tbody></table></div></div><div style="display:grid;gap:17px"><div class="card"><div class="card-head"><h3>Recent feedback</h3><span class="pill orange">${pending} to review</span></div>${state.assignments.filter(a=>a.feedback).slice(-3).reverse().map(a=>`<div class="list-row"><div><div class="heading">${esc(a.name)} · ${esc(getGame(getCamp(a.campaignId).gameId).name)}</div><div class="secondary">${esc(a.feedback.stuck).slice(0,78)}${a.feedback.stuck.length>78?'…':''}</div></div><span class="pill ${a.status==='approved'?'green':'orange'}">${a.status==='approved'?'Approved':'Pending'}</span></div>`).join('')}<button class="btn white sm" style="margin-top:14px;width:100%" data-nav="campaigns">Review submissions</button></div><div class="narrative-card"><div class="overline">Product principle</div><h3 style="margin-top:8px">Pay for insight, not minutes played.</h3><p style="font-size:12px;margin-bottom:0">Verified feedback earns rewards. Paid testing sessions are excluded from organic discovery signals, protecting ranking integrity.</p></div></div></div>`}
function games(){return `${heading('Your games','Understand what to test before committing to game acquisition.',`<button class="btn primary" data-nav="create">${ico('plus')} New playtest</button>`)}<div class="grid-3">${GAMES.slice(0,3).map(g=>`<div class="game-card">${gameArt(g)}<div class="game-details"><div class="game-meta"><strong>${g.name}</strong><span class="pill blue">${g.stage}</span></div><p>${g.desc}</p><div class="actions-inline"><button class="btn primary sm" data-action="gameCreate" data-id="${g.id}">Start a test</button><button class="btn white sm" data-nav="insights">See insights</button></div></div></div>`).join('')}</div><div class="tip top-tip" style="margin-top:22px">${ico('info',15)} Roblox already provides beta access and analytics. Launchpad adds participant discovery, structured assignments, compensation, and an auditable feedback workflow.</div>`}
function campaignList(){return `${heading('Playtest campaigns','Track developer-funded testing and review actionable player submissions.',`<button class="btn primary" data-nav="create">${ico('plus')} New campaign</button>`)}<div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Playtest</th><th>Status</th><th>Assignments</th><th>Reward / tester</th><th></th></tr></thead><tbody>${state.campaigns.map(gameRow).join('')}</tbody></table></div></div><div class="tip" style="margin-top:18px">${ico('shield',16)} Paid sessions must be isolated from organic recommendation signals and Creator Rewards eligibility. Compensation is based on verified feedback, never favorable ratings.</div>`}
function campaignDetail(){const c=getCamp(selectedCampaign);if(!c)return campaignList();const g=getGame(c.gameId),as=allFor(c.id),paid=approved(c).length*c.reward;return `<div class="backline"><button class="backlink" data-nav="campaigns">← All playtests</button></div>${heading(esc(c.title),`${g.name} · ${c.objective}`,`<span class="pill green">Active campaign</span>`)}<div class="grid-4" style="margin-bottom:18px">${[['Testers',`${as.length} / ${c.slots}`,'users'],['Pending review',submitted(c).length,'clock'],['Disbursed',money(paid),'wallet'],['Budget reserved',money(totalCost(c)),'shield']].map(([l,v,i])=>`<div class="card metric"><div class="metric-icon">${ico(i)}</div><div class="metric-label">${l}</div><div class="metric-value" style="font-size:23px">${v}</div></div>`).join('')}</div><div class="split"><div><div class="card"><div class="card-head"><h3>Feedback submissions</h3><span class="pill">${as.length} received / accepted</span></div>${as.length?as.map(a=>`<div class="feedback"><div class="meta"><div><strong>${esc(a.name)}</strong><div class="micro">${esc(a.device)} · ${esc(a.created)}</div></div><span class="pill ${a.status==='approved'?'green':a.status==='submitted'?'orange':'blue'}">${a.status==='approved'?'Approved':a.status==='submitted'?'Review required':a.status==='revision'?'Revision requested':'Assigned'}</span></div>${a.feedback?`<p><strong>What worked</strong> — ${esc(a.feedback.worked)}</p><p><strong>Where they got stuck</strong> — ${esc(a.feedback.stuck)}</p><p><strong>Improvement</strong> — ${esc(a.feedback.improve)}</p><div class="feedback-actions">${a.status==='submitted'?`<button class="btn primary sm" data-action="approve" data-id="${a.id}">${ico('check',14)} Approve & release ${money(c.reward)}</button><button class="btn white sm" data-action="requestRevision" data-id="${a.id}">Request revision</button>`:''}</div>`:'<p>Accepted assignment. Feedback has not been submitted.</p>'}</div>`).join(''):`<div class="empty"><div class="symbol">📝</div><strong>No assignments yet</strong><p>Switch to Player and accept this playtest to try the workflow.</p></div>`}</div></div><div><div class="card"><div style="display:flex;align-items:center;gap:13px;margin-bottom:15px">${gameArt(g,true)}<div><h3 style="margin:0">${g.name}</h3><small>${g.genre}</small></div></div><p>${esc(c.description)}</p><div class="overline">Objectives</div>${c.tasks.map(t=>`<div class="check-row">${ico('check',14)} ${esc(t)}</div>`).join('')}<div class="rule"></div><div class="bill-line"><span>Reward per approved test</span><strong>${money(c.reward)}</strong></div><div class="bill-line"><span>Target testers</span><strong>${c.slots}</strong></div><div class="bill-line"><span>Illustrative platform fee (10%)</span><strong>${money(fee(c))}</strong></div><div class="bill-line total"><span>Total budget</span><strong>${money(totalCost(c))}</strong></div><div class="micro">Simulated reservation. No real Robux movement.</div></div></div></div>`}
function wizard(){const g=getGame(draft.gameId);return `${heading('Create a playtest','Define exactly what feedback you need, then fund rewards for verified contributions.')}<div class="wizard-progress"><span class="on"></span><span class="${wizardStep>=2?'on':''}"></span><span class="${wizardStep>=3?'on':''}"></span></div><div class="split"><div class="card"><div class="eyebrow">Step ${wizardStep} of 3 · ${['Scope your test','Find the right players','Review & fund'][wizardStep-1]}</div>${wizardStep===1?`<h2>What should players test?</h2><div class="field"><label class="label" for="gameId">Select game</label><select id="gameId" class="input">${GAMES.slice(0,3).map(x=>`<option value="${x.id}" ${draft.gameId===x.id?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="field"><label class="label" for="testTitle">Assignment title *</label><input id="testTitle" class="input" maxlength="80" placeholder="e.g. First-time onboarding and puzzle clarity" value="${esc(draft.title)}"></div><div class="field"><label class="label" for="objective">Testing objective</label><select id="objective" class="input">${['First-time onboarding','Gameplay difficulty & balance','Multiplayer collaboration','Retention & replayability','Device performance & controls'].map(x=>`<option ${draft.objective===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label" for="description">What are you trying to learn? *</label><textarea id="description" placeholder="Describe the problem and what a useful playtest would reveal.">${esc(draft.description)}</textarea></div><div class="field"><label class="label" for="tasks">Testing tasks (one per line) *</label><textarea id="tasks" style="min-height:115px">${esc(draft.tasks.join('\n'))}</textarea><p>Reward independent, honest reports—not positive feedback or time spent.</p></div>`:wizardStep===2?`<h2>Choose your test audience.</h2><div class="field"><label class="label">Supported devices</label><label cla function vision(){return `${heading('From testing to discovery','A staged vision that connects better games with the audiences who want to play them.')}<div class="grid-2" style="margin-bottom:20px"><div class="card"><div class="eyebrow">MVP · Working prototype</div><h2>Creator Launchpad</h2><p>Commission qualified playtests, review actionable reports and reward meaningful contributions. The goal is to improve game quality before investing in reaching a larger audience.</p><button class="btn primary" data-role="developer" data-nav="create">Explore testing ${ico('arrow',15)}</button></div><div class="card soft"><div class="eyebrow">Future · Discovery and distribution</div><h2>Moments + Roblox Live</h2><p>Promote games that demonstrate compelling retained play, while also giving everyday players more ways to stream together and discover experiences organically.</p><span class="pill blue">Concept only · Not a real stream</span></div></div><div class="split"><div class="roadmap"><div class="phase"><div class="phase-index">1</div><div><h3>Validate the core marketplace</h3><p>Compare structured paid playtesting with current beta workflows. Measure time to first actionable feedback, quality of revisions, publication, and later retention.</p><span class="pill green">Demonstrated in this prototype</span></div></div><div class="phase"><div class="phase-index">2</div><div><h3>Make Roblox Live a destination for play</h3><p>Pilot gameplay-only broadcasts for eligible 18+ accounts, friend co-streaming, Followed / Discover feeds and permissioned Join Experience. Measure incremental game discovery and seven-day retained play before adding sponsorship.</p><span class="pill blue">Separate hypothesis to validate</span></div></div><div class="phase"><div class="phase-index">3</div><div><h3>Open optional creator opportunities</h3><p>Offer approved developer-sponsored Moments and Live showcases as separate jobs in Launchpad, with disclosure, attribution and campaign safeguards. Never reward fabricated views or paid gameplay as organic demand.</p><span class="pill orange">Conditional expansion</span></div></div><div class="card"><div class="eyebrow">Opportunity types</div><div class="grid-3">${[['Test a game','Available in demo'],['Create a Moment','Future'],['Host a showcase','Future']].map(([h,v])=>`<div style="padding:10px;border-radius:11px;background:#f5f6fc"><strong style="font-size:12px">${h}</strong><div class="micro" style="margin-top:6px">${v}</div></div>`).join('')}</div></div></div><div><div class="live-mock"><div class="live-visual"><span class="live-label">● LIVE CONCEPT</span><span class="live-count">${ico('users',12)} 124 viewers · demo</span><span class="emoji">🏚️</span></div><div class="live-body"><div class="eyebrow" style="color:#a3aee6">Roblox Live · Illustrative experience</div><h3 style="color:#fff;font-size:19px">Midnight Manor, with friends</h3><p>Two friends co-stream a cooperative mystery game. Discover the experience and join when the streamer allows it.</p><div class="tag-list"><span class="tag" style="background:#2c3755;border-color:#46506b;color:#bcc5e1">18+ verified pilot</span><span class="tag" style="background:#2c3755;border-color:#46506b;color:#bcc5e1">Gameplay only</span><span class="tag" style="background:#2c3755;border-color:#46506b;color:#bcc5e1">Co-host invited</span></div><div class="mock-cta">Join Experience · Concept</div></div></div><div class="tip" style="margin-top:16px">${ico('shield',16)} A real Live launch would need age verification, real-time moderation, reporting and removal, streamer privacy controls, co-host permissions, and limits on stream sniping. Paid showcase streams require disclosure.</div></div></div>`}
function strategy(){return `${heading('The product thesis','Connecting game validation, player participation, and distribution within Roblox’s existing economy.')}<div class="card" style="padding:27px;margin-bottom:20px"><div class="eyebrow">The unmet workflow</div><h2 style="max-width:750px">Creators can find testers today. The gap is turning recruitment, compensation, and feedback into a repeatable product.</h2><p style="max-width:780px;margin-bottom:0">Roblox already supports beta access, analytics and developer communities. Creator Launchpad does not replace them; it creates a structured two-sided marketplace around a specific outcome: reliable human feedback before a game reaches its audience.</p></div><div class="faq" style="margin-bottom:20px"><div class="card"><div class="circle-icon">${ico('games')}</div><h3 style="margin-top:14px">For developers</h3><p>Recruit testers matched to a genre, device and objective. Fund specific assignments, evaluate friction, and decide what to fix before expanding distribution.</p></div><div class="card"><div class="circle-icon">${ico('users')}</div><h3 style="margin-top:14px">For players</h3><p>Contribute to game creation without coding or an established audience. Earn Robux for verified work, not minutes or praise.</p></div><div class="card"><div class="circle-icon">${ico('trending')}</div><h3 style="margin-top:14px">For Roblox</h3><p>Test a transaction-fee marketplace and whether greater game quality, player participation and Robux circulation drive incremental platform value.</p></div></div><div class="split"><div class="card"><h3>How I would test it</h3>${[['1','Research first','Interview developers of different sizes and players who currently volunteer or are paid to test games. Map the current beta-testing workflow and costs.'],['2','Run a controlled pilot','Recruit eligible adult developers and testers. Compare Launchpad to Roblox’s existing beta workflows rather than to no testing at all.'],['3','Measure real quality','Primary: verified actionable feedback per developer within time and budget. Secondary: time to first useful feedback, iterations, publish rate, and D7 game retention.'],['4','Consider distribution','Separately pilot organic Live to establish whether it increases new-game discovery and retained play before adding paid Moments or Live campaigns.']].map(([n,h,p])=>`<div class="numbered"><b>${n}</b><div><strong>${h}</strong><p>${p}</p></div></div>`).join('')}</div><div class="card"><h3>Marketplace integrity by design</h3>${[['Verification, not vanity','Pay for completed test objectives and concrete observations, never idle time or positive ratings.'],['Protect game discovery','Tag compensated sessions and exclude them from organic recommendation signals and Creator Rewards attribution.'],['Fair and safe participation','Pilot with eligible age-verified adults, per-user task limits, duplicate/fraud checks, transparent review criteria and dispute escalation.'],['Trust in sponsored content','Mark paid Moments and Live campaigns clearly; do not boost them as if organic and do not reward fabricated engagement.'],['Prove the economics','Evaluate incremental purchases and repeat play rather than equating existing Robux transfers with new Roblox revenue.']].map(([h,p])=>`<div class="feature-line"><span class="feature-icon">${ico('shield')}</span><div><strong>${h}</strong><p>${p}</p></div></div>`).join('')}</div></div><div class="tip warn" style="margin-top:18px">Independent concept for product-design exploration. No Roblox partnership, research study, validated business results, or real transaction system is implied. All metrics shown elsewhere are sample demo data.</div>`}
function modalContent(){if(!modal)return '';if(modal.kind==='revision'){const a=state.assignments.find(x=>x.id===modal.id);return `<h2>Request a revision</h2><p>Provide a specific, fair clarification request. Feedback cannot be rejected simply because it is critical.</p><form id="revisionForm"><label class="label" for="revisionReason">What additional evidence is needed?</label><textarea id="revisionReason" required minlength="12" placeholder="For example, please identify which step of the puzzle failed on mobile."></textarea><div class="modal-actions"><button type="button" class="btn white" data-action="closeModal">Cancel</button><button type="submit" class="btn primary">Send revision request</button></div></form>`}if(modal.kind==='assignment'){const a=state.assignments.find(x=>x.id===modal.id),c=getCamp(a.campaignId);return `<h2>${esc(c.title)}</h2><span class="pill ${a.status==='approved'?'green':'orange'}">${a.status}</span>${a.feedback?`<div class="review-block"><strong>What worked</strong><p>${esc(a.feedback.worked)}</p><strong>Where I got stuck</strong><p>${esc(a.feedback.stuck)}</p><strong>Suggested improvement</strong><p>${esc(a.feedback.improve)}</p></div>`:'<p>Feedback not submitted yet.</p>'}<div class="modal-actions"><button class="btn primary" data-action="closeModal">Done</button></div>`}return ''}
function renderModal(){return `<div class="modal-bg" data-action="modalBackdrop"><div class="modal" role="dialog" aria-modal="true">${modalContent()}</div></div>`}
function render(){let v={overview,games,campaigns:campaignList,campaign:campaignDetail,create:wizard,insights,economics,opportunities,opportunity:opportunityDetail,assignments:assignmentList,feedback:feedbackForm,earnings,vision,strategy}[page]||overview;shell(v());document.title=`${[...developerNav,...playerNav,...sharedNav].find(x=>x[0]===page)?.[1]||'Creator Launchpad'} — Creator Launchpad`}
function captureWizard(){if(wizardStep===1){draft.gameId=document.getElementById('gameId').value;draft.title=document.getElementById('testTitle').value.trim();draft.objective=document.getElementById('objective').value;draft.description=document.getElementById('description').value.trim();draft.tasks=document.getElementById('tasks').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!draft.title||draft.description.length<15||draft.tasks.length<1){toast('Enter a title, a description of at least 15 characters, and testing tasks.');return false}}else if(wizardStep===2){draft.devices=[...document.querySelectorAll('input[name="d"]:checked')].map(x=>x.value);draft.audience=document.getElementById('audience').value;draft.slots=Number(document.getElementById('slots').value);draft.reward=Number(document.getElementById('reward').value);draft.minutes=Number(document.getElementById('minutes').value);if(!draft.devices.length||draft.slots<2||draft.slots>30||draft.reward<10||draft.reward>10000||draft.minutes<5||draft.minutes>120){toast('Choose a device and valid tester, duration, and reward values.');return false}}return true}
function createCampaign(){let id='cp'+Date.now();const c={...draft,id,created:new Date().toISOString().slice(0,10),status:'Active',tasks:[...draft.tasks],devices:[...draft.devices]};state.campaigns.unshift(c);persist();draft={gameId:'midnight',objective:'First-time onboarding',title:'',description:'',tasks:['Play through the opening five minutes','Identify any confusing instructions','Suggest one improvement'],devices:['Desktop','Mobile'],audience:'New to genre',slots:6,reward:90,minutes:15};selectedCampaign=id;navTo('campaign',id);toast('Playtest published! Switch to Player to find the new opportunity.')}
function updateEstimate(){if(page!=='create'||wizardStep!==2)return;let slots=Number(document.getElementById('slots')?.value)||0,reward=Number(document.getElementById('reward')?.value)||0;document.getElementById('estimate-slots').textContent=slots;document.getElementById('estimate-reward').textContent=money(reward);document.getElementById('estimate-total').textContent=money(Math.round(slots*reward*1.1))}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-nav],[data-action],[data-role]');if(!btn)return;if(btn.dataset.role && !btn.dataset.nav){setRole(btn.dataset.role);return}if(btn.dataset.role&&btn.dataset.nav)role=btn.dataset.role;if(btn.dataset.nav){const p=btn.dataset.nav,id=btn.dataset.id;if(p==='opportunity'||p==='campaign')selectedCampaign=id;navTo(p,id);return}const action=btn.dataset.action,id=btn.dataset.id;if(action==='menu'){mobileMenu=!mobileMenu;render()}if(action==='reset'){if(confirm('Reset all simulated campaigns, assignments, and balances to the original demo data?')){state=JSON.parse(JSON.stringify(SEED));persist();role='developer';page='overview';render();toast('Demo restored to sample data.')}}if(action==='gameCreate'){draft.gameId=id;navTo('create')}if(action==='wizardBack'){if(wizardStep===1){navTo('overview')}else{wizardStep--;render()}}if(action==='wizardNext'){if(wizardStep<3){if(!captureWizard())return;wizardStep++;render();scrollTo({top:0,behavior:'smooth'})}else createCampaign()}if(action==='accept'){const c=getCamp(id);if(!c||available(c)<=0){toast('All testing spots have been filled.');return}if(playerAssignments().some(a=>a.campaignId===id)){toast('You already joined this playtest.');return}state.assignments.push({id:'a'+Date.now(),campaignId:id,playerId:'you',name:'You',device:c.devices[0],status:'accepted',created:new Date().toISOString().slice(0,10),feedback:null});persist();navTo('assignments');toast('Playtest accepted. Open the assignment to submit feedback.')}if(action==='feedback'){selectedAssignment=id;navTo('feedback')}if(action==='approve'){const a=state.assignments.find(x=>x.id===id);if(a&&a.status==='submitted'){a.status='approved';persist();render();toast(`${money(getCamp(a.campaignId).reward)} released to ${a.name} in the demo ledger.`)}}if(action==='requestRevision'){modal={kind:'revision',id};render()}if(action==='assignmentDetails'){modal={kind:'assignment',id};render()}if(action==='closeModal'){modal=null;render()}if(action==='modalBackdrop'&&e.target===btn){modal=null;render()}if(action==='clearFilters'){search='';deviceFilter='All devices';genreFilter='All genres';render()}});
document.addEventListener('submit',e=>{if(e.target.id==='feedbackForm'){e.preventDefault();let checked=[...document.querySelectorAll('input[name="task"]')].every(x=>x.checked),worked=document.getElementById('worked').value.trim(),stuck=document.getElementById('stuck').value.trim(),improve=document.getElementById('improve').value.trim();if(!checked||[worked,stuck,improve].some(s=>s.length<12)){toast('Complete every objective and provide at least 12 characters in each feedback field.');return}const a=state.assignments.find(a=>a.id===selectedAssignment);if(!a)return;a.feedback={worked,stuck,improve,rating:Number(document.getElementById('rating').value)||null};a.device=document.getElementById('feedbackDevice').value;a.status='submitted';a.created=new Date().toISOString().slice(0,10);delete state.revisionNotes[a.id];persist();navTo('assignments');toast('Feedback submitted for developer review. Reward is pending approval.')}if(e.target.id==='revisionForm'){e.preventDefault();let note=document.getElementById('revisionReason').value.trim();if(note.length<12){toast('Please give a specific revision request.');return}const a=state.assignments.find(a=>a.id===modal.id);a.status='revision';state.revisionNotes[a.id]=note;persist();modal=null;render();toast('Revision request sent; no payment has been released.')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const cursor=e.target.selectionStart;render();const el=document.getElementById('search');if(el){el.focus();el.setSelectionRange(cursor,cursor)}}if(['slots','reward'].includes(e.target.id))updateEstimate()});document.addEventListener('change',e=>{if(e.target.id==='deviceFilter'){deviceFilter=e.target.value;render()}if(e.target.id==='genreFilter'){genreFilter=e.target.value;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});render();
</script></body>
</html>
