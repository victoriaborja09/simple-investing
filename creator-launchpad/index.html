/* Creator Launchpad independent marketplace concept */
:root{
  color-scheme:light;
  --ink:#191b20;
  --muted:#65717d;
  --line:#e8eaf0;
  --paper:#fff;
  --card:#fff;
  --blue:#2374D8;
  --blue2:#eaf3fe;
  --green:#239B62;
  --greenbg:#e2f7ec;
  --orange:#D98C16;
  --orangebg:#fff4e3;
  --red:#CB3F4C;
  --shadow:0 2px 13px rgba(33,46,60,.035);
}
*{box-sizing:border-box}
body{background:#fff;color:var(--ink);font:14px/1.48 Arial,Helvetica,sans-serif;letter-spacing:0;-webkit-font-smoothing:antialiased}
p,small{color:#65717D}
h1,h2,h3{color:#17191d;font-family:Arial,Helvetica,sans-serif;letter-spacing:-.025em;font-weight:750}
h1{font-size:34px;line-height:1.14}h2{font-size:21px;line-height:1.2}h3{font-size:16px}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #38bfd0;outline-offset:2px}
.launchpad-shell .sidebar{background:#eaf6fc;position:sticky;top:0;width:82px;flex:0 0 82px;padding:12px 6px 13px;z-index:30;border-right:1px solid #ddecf4;display:flex;align-items:center;box-shadow:none;transition:width .18s}
.rail-brand{height:54px;display:flex;align-items:flex-start;justify-content:center;padding-top:9px;width:100%}

.roblox-mark:before{content:"";position:absolute;background:#eaf6fc;width:8px;height:8px;left:7px;top:7px}
.nav-list{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:5px}
.nav-item{background:transparent;color:#313b49;border:1px solid transparent;border-radius:9px;min-height:64px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;font-weight:700;line-height:1.15;text-align:center;transition:background .16s,color .16s;width:100%;letter-spacing:-.02em}
.nav-item svg{width:24px;height:24px;color:#2b3440;stroke-width:2.25}
.nav-item span{display:block;max-width:70px;line-height:1.1}
.nav-item.active{background:white;color:#131b25;border-color:#d3e8f6;box-shadow:0 2px 5px rgba(37,71,99,.06)}
.nav-item.active:before{display:none}
.nav-item.active svg{color:#2374D8}
.nav-item:hover{background:#dff0fc;color:#17191d}

function gameRow(c){const g=getGame(c.gameId);const count=allFor(c.id).length;return `<tr><td><div class="game-inline">${gameArt(g,true)}<div><strong>${esc(c.title)}</strong><small>${esc(g.name)} · ${esc(c.objective)}</small></div></div></td><td><span class="pill green">Active</span></td><td>${count} / ${c.slots}</td><td class="mono">${money(c.reward)}</td><td><button class="btn white sm" data-nav="campaign" data-id="${c.id}">Review ${ico('chevron',12)}</button></td></tr>`}
function overview(){
 const committed=state.campaigns.reduce((a,c)=>a+totalCost(c),0),approvedNum=state.assignments.filter(a=>a.status==='approved').length,reports=state.assignments.filter(a=>a.feedback).length;
 const latest=state.assignments.filter(a=>a.feedback).slice(-3).reverse();
 return `<section class="welcome-line"><div><span class="eyebrow">CREATOR HOME</span><h1>Your creator home</h1><p>Manage playtests and see what players are finding in your games.</p></div><button class="btn primary" data-nav="create">${ico('plus',17)} Create playtest</button></section>
 <section class="home-block"><div class="home-title-row"><h2>Your experiences <span>(${Math.min(3,GAMES.length)})</span></h2><button class="text-link" data-nav="games">See all ${ico('chevron',16)}</button></div>
 <div class="experience-gallery">${GAMES.slice(0,3).map(g=>`<button class="experience-tile" data-action="gameCreate" data-id="${g.id}" aria-label="Create playtest for ${esc(g.name)}">${gameArt(g)}<strong>${esc(g.name)}</strong><span>${esc(g.genre)} <b class="dot-separator">•</b> ${esc(g.stage)}</span></button>`).join('')}</div></section>
 <section class="home-block"><div class="home-title-row"><h2>Testing activity</h2><span class="section-hint">Your marketplace at a glance</span></div>
 <div class="overview-stats"><div><span>Active playtests</span><strong>${state.campaigns.length}</strong></div><div><span>Reports received</span><strong>${reports}</strong></div><div><span>Reports approved</span><strong>${approvedNum}</strong></div><div><span>Robux committed</span><strong>${money(committed)}</strong></div></div></section>
 <section class="home-block"><div class="home-title-row"><h2>Playtests in progress <span>(${state.campaigns.length})</span></h2><button class="text-link" data-nav="campaigns">View all ${ico('chevron',16)}</button></div>
 <div class="active-test-grid">${state.campaigns.slice(0,3).map(c=>{const g=getGame(c.gameId),count=allFor(c.id).length;return `<button class="test-tile" data-nav="campaign" data-id="${c.id}"><div class="test-tile-art">${gameArt(g)}</div><div class="test-tile-body"><span class="mini-category">${esc(g.name)}</span><strong>${esc(c.title)}</strong><span class="tiny-info">${count} of ${c.slots} tester spots filled</span><div class="test-bottom"><span class="pill green">Accepting testers</span><b>${money(c.reward)} <small>/ tester</small></b></div></div></button>`}).join('')}</div></section>
 <section class="home-block lower-home"><div class="home-feed"><div class="home-title-row"><h2>Recent feedback</h2><button class="text-link" data-nav="campaigns">All reports ${ico('chevron',16)}</button></div>
 <div class="feed-list">${latest.length?latest.map(a=>`<div class="feed-entry"><div class="friend-avatar ${a.status==='approved'?'av-green':'av-violet'}">${esc(a.name).slice(0,1)}</div><div class="feed-copy"><strong>${esc(a.name)} tested ${esc(getGame(getCamp(a.campaignId).gameId).name)}</strong><p>${esc(a.feedback.stuck)}</p></div><span class="pill ${a.status==='approved'?'green':'orange'}">${a.status==='approved'?'Approved':'Pending'}</span></div>`).join(''):`<div class="empty-note">Your feedback reports will appear here.</div>`}</div></div>
 <div class="home-tip"><div class="tip-icon">${ico('shield',21)}</div><h3>Fair rewards for real work</h3><p>Players earn their stated Robux reward when they complete the published evidence checklist. Negative feedback does not affect payment.</p><button class="text-link" data-nav="strategy">How Launchpad works ${ico('arrow',16)}</button></div></section>`;
}
function games(){return `${heading('Your games','Understand what to test before publishing or releasing an update.',`<button class="btn primary" data-nav="create">${ico('plus')} New playtest</button>`)}<div class="grid-3">${GAMES.slice(0,3).map(g=>`<div class="game-card">${gameArt(g)}<div class="game-details"><div class="game-meta"><strong>${g.name}</strong><span class="pill blue">${g.stage}</span></div><p>${g.desc}</p><div class="actions-inline"><button class="btn primary sm" data-action="gameCreate" data-id="${g.id}">Start a test</button><button class="btn white sm" data-nav="insights">See insights</button></div></div></div>`).join('')}</div><div class="tip top-tip" style="margin-top:22px">${ico('info',15)} Roblox already provides beta access and analytics. Launchpad adds tester matching, structured assignments, compensation, and an auditable feedback workflow.</div>`}
function campaignList(){return `${heading('Playtest campaigns','Track developer-funded testing and inspect documented player observations.',`<button class="btn primary" data-nav="create">${ico('plus')} New campaign</button>`)}<div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Playtest</th><th>Status</th><th>Assignments</th><th>Reward / tester</th><th></th></tr></thead><tbody>${state.campaigns.map(gameRow).join('')}</tbody></table></div></div><div class="tip" style="margin-top:18px">${ico('shield',16)} Paid sessions must be isolated from organic recommendation signals and Creator Rewards eligibility. Compensation is based on verified feedback, never favorable ratings.</div>`}

}

function feedbackForm(){const a=state.assignments.find(x=>x.id===selectedAssignment);if(!a)return assignmentList();const c=getCamp(a.campaignId),g=getGame(c.gameId);return `<div class="backline"><button class="backlink" data-nav="assignments">← My assignments</button></div>${heading('Submit playtest evidence',`${g.name} · ${c.title}`,`<span class="pill blue">Fixed reward: ${money(c.reward)}</span>`)}<div class="split"><div class="card"><h3>Document what happened during your test</h3><p>Record the outcome for every published task. If you could not finish a task, choose Blocked and explain what stopped you. Negative observations and reports of no issues are both eligible.</p><form id="feedbackForm"><div class="field"><label class="label">Task-by-task log (required)</label>${c.tasks.map((t,i)=>`<div class="review-block" style="margin:11px 0"><strong>${i+1}. ${esc(t)}</strong><div class="field" style="margin-top:10px"><label class="label" for="result${i}">Result *</label><select id="result${i}" class="input" required><option value="Completed">Completed</option><option value="Blocked">Blocked</option></select></div><div class="field"><label class="label" for="evidence${i}">Action taken and actual outcome (25+ characters) *</label><textarea id="evidence${i}" required minlength="25" placeholder="For example, I tapped the key beside the painting twice, but no interaction appeared."></textarea></div></div>`).join('')}</div><div class="field"><label class="label" for="stuck">One specific friction point, or why none occurred (25+ characters) *</label><textarea id="stuck" required minlength="25" placeholder="Name the level, control, or action. If nothing went wrong, state what you tested and how it behaved."></textarea></div><div class="field"><label class="label" for="improve">Specific improvement, or why no change is needed (25+ characters) *</label><textarea id="improve" required minlength="25" placeholder="For example, keep the puzzle objective visible beside the inventory function economics(){const committed=state.campaigns.reduce((s,c)=>s+rewardPool(c),0),disbursed=state.assignments.filter(a=>a.status==='approved').reduce((s,a)=>s+getCamp(a.campaignId).reward,0),fees=state.campaigns.reduce((s,c)=>s+fee(c),0);return `${heading('Robux economics','Developer-funded rewards are committed when campaigns are published, with payouts determined by a published checklist.')}<div class="grid-3" style="margin-bottom:20px">${[['Reward budget committed',money(committed),'Developer-funded tester rewards'],['Qualifying rewards released',money(disbursed),'Simulated payments for completed reports'],['Proposed fees reserved',money(fees),'Illustrative 10% marketplace fee']].map(([l,v,d])=>`<div class="card metric"><div class="metric-label">${l}</div><div class="metric-value" style="font-size:26px">${v}</div><div class="metric-detail">${d}</div></div>`).join('')}</div><div class="split"><div class="card"><h3>Campaign budget allocation</h3>${state.campaigns.map(c=>`<div style="margin:17px 0"><div class="bill-line"><span>${esc(getGame(c.gameId).name)}</span><strong>${money(totalCost(c))}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(rewardPool(c)/totalCost(c)*100)}%"></div></div><div class="micro" style="margin-top:6px">Reward pool ${money(rewardPool(c))} · proposed fee ${money(fee(c))}</div></div>`).join('')}</div><div class="card"><h3>Who captures value?</h3>${[['Developers','Commit fixed rewards upfront for defined test tasks, then review reports to prioritize fixes.'],['Players','Earn the published amount for completing the evidence checklist, not for favorable opinions.'],['Roblox','Potential fees, improved game quality, and possible incremental purchases, each requiring validation.']].map(([h,p])=>`<div class="feature-line"><span class="feature-icon">${ico('arrow')}</span><div><strong>${h}</strong><p>${p}</p></div></div>`).join('')}</div></div><div class="tip warn" style="margin-top:20px">${ico('info',16)} Financial figures are hypothetical and do not represent Roblox fees or actual balances. Redistributing existing Robux is not automatically incremental revenue. A real pilot would measure incremental Robux purchases, creator spending and net platform contribution.</div>`}
function earnings(){const as=playerAssignments(),approvedAs=as.filter(a=>a.status==='approved'),pending=as.filter(a=>a.status==='submitted'),earned=approvedAs.reduce((s,a)=>s+getCamp(a.campaignId).reward,0),pendingAmt=pending.reduce((s,a)=>s+getCamp(a.campaignId).reward,0);return `${heading('My rewards','Fixed rewards for reports meeting the published evidence requirements. This ledger is simulated.')}<div class="grid-3" style="margin-bottom:20px">${[['Qualifying rewards',money(earned),'wallet'],['Pending independent check',money(pendingAmt),'clock'],['Completed playtests',approvedAs.length,'check']].map(([l,v,i])=>`<div class="card metric"><div class="metric-icon">${ico(i)}</div><div class="metric-label">${l}</div><div class="metric-value">${v}</div></div>`).join('')}</div><div class="split"><div class="card"><h3>Reward activity</h3>${as.length?as.slice().reverse().map(a=>{const c=getCamp(a.campaignId);return `<div class="list-row"><div><div class="heading">${esc(c.title)}</div><div class="secondary">${esc(getGame(c.gameId).name)} · ${esc(a.created)}</div></div><div style="text-align:right"><strong>${money(c.reward)}</strong><div><span class="pill ${a.status==='approved'?'green':a.status==='submitted'?'orange':'blue'}">${a.status}</span></div></div></div>`}).join(''):`<p>No activity yet.</p>`}</div><div class="card"><h3>How rewards work</h3><div class="feature-line"><span class="feature-icon">${ico('clipboard')}</span><div><strong>Deliver feedback</strong><p>Log each assigned task, record what happened, and give a specific observation and recommendation.</p></div></div><div class="feature-line"><span class="feature-icon">${ico('shield')}</span><div><strong>Objective payout rule</strong><p>Developers pre-fund rewards and cannot veto payment based on opinion. Production verification and disputes would be handled by Roblox.</p></div></div><div class="feature-line"><span class="feature-icon">${ico('wallet')}</span><div><strong>Rewards recirculate</strong><p>A future real system could put Robux in players' hands for eligible purchases within Roblox.</p></div></div></div></div><div class="tip warn" style="margin-top:20px">No Roblox account is connected and no actual Robux can be earned or spent here. Roblox payment and cash-out rules would require a separate policy and technical review.</div>`}
function insights(){let reviews=state.assignments.filter(a=>a.feedback);return `${heading('What players are telling you','Turn structured playtests into actionable design decisions.')}<div class="grid-4" style="margin-bottom:20px">${[['Feedback reports',reviews.length,'clipboard'],['Rewards released',reviews.filter(a=>a.status==='approved').length,'wallet'],['Games tested',new Set(reviews.map(a=>getCamp(a.campaignId).gameId)).size,'games'],['Tracked devices',new Set(reviews.map(a=>a.device)).size,'target']].map(([l,v,i])=>`<div class="card metric"><div class="metric-icon">${ico(i)}</div><div class="metric-label">${l}</div><div class="metric-value">${v}</div><div class="metric-detail">Illustrative demo data</div></div>`).join('')}</div><div class="split"><div class="card"><h3>Example friction themes</h3><p style="font-size:12px">Seeded, illustrative qualitative categorization. A real product would generate these from verified feedback and evidence.</p>${[['Unclear instructions',80],['Discoverability of controls',64],['Difficulty spikes',45],['Multiplayer invites',34]].map(([l,v])=>`<div style="margin:20px 0"><div class="bill-line"><span>${l}</span><strong>${v}%*</strong></div><div class="bar-track"><div class="bar-fill" style="width:${v}%"></div></div></div>`).join('')}<div class="micro">*Decorative example values, not measured user research.</div></div><div class="card"><h3>Evidence from players</h3>${reviews.slice(0,4).map(a=>`<div class="quote">“${esc(a.feedback.stuck)}”<div class="micro" style="margin-top:9px">${esc(getGame(getCamp(a.campaignId).gameId).name)} · ${esc(a.device)}</div></div>`).join('')}</div></div><div class="card" style="margin-top:20px"><h3>Measurement integrity</h3><div class="grid-3" style="margin-top:18px">${[['Incentivized sessions','Tagged and excluded from organic discovery ranking signals.'],['Organic retention','Measured separately after players independently choose to return.'],['Iterate before releasing updates','Use reproduced issues and player observations to prioritize changes to your experience.']].map(([h,p])=>`<div class="narrative-card"><strong>${h}</strong><p style="font-size:12px;margin:8px 0 0">${p}</p></div>`).join('')}</div></div>`}
function strategy(){return `${heading('Why Creator Launchpad?','One product for commissioning playtests, recording evidence, and compensating players against published terms.')}<div class="card" style="padding:27px;margin-bottom:20px"><div class="eyebrow">The current gap</div><h2 style="max-width:800px">Roblox already lets developers beta-test games. Launchpad makes recruiting, paying, and learning from testers a repeatable workflow.</h2><p style="max-width:790px;margin-bottom:0">Developers can recruit through communities and invite testers today. Launchpad combines a searchable pool of eligible players, defined testing assignments, upfront Robux funding, and standardized observation logs within a single workflow.</p></div><div class="faq" style="margin-bottom:20px"><div class="card"><div class="circle-icon">${ico('games')}</div><h3 style="margin-top:14px">Developers</h3><p>Recruit players by device and game experience, publish fixed task criteria, lock a reward budget, and receive issue reports they can use to prioritize revisions.</p></div><div class="card"><div class="circle-icon">${ico('users')}</div><h3 style="margin-top:14px">Players</h3><p>Earn Robux for documenting test outcomes without coding skills, social followers, or the need to praise a game.</p></div><div class="card"><div class="circle-icon">${ico('trending')}</div><h3 style="margin-top:14px">Roblox</h3><p>Test whether developer-funded work increases game quality and player participation, and whether fees or new purchases create incremental economic value.</p></div></div><div class="split"><div class="card"><h3>The published completion standard</h3>${[['1','Defined tasks','A developer chooses testing objectives, devices, and a fixed reward before publishing. These terms cannot change for accepted assignments.'],['2','Recorded evidence','For every task, a player selects Completed or Blocked and describes their action and its outcome in at least 25 characters.'],['3','Specific observations','The report names a friction point or explains why none appeared, and proposes one change or explains why none is needed. Each response requires at least 25 characters.'],['4','Platform verification','A production platform would verify task evidence and flag duplicates or fraud. Developers see the results but cannot veto earned rewards because feedback is negative.']].map(([n,h,p])=>`<div class="numbered"><b>${n}</b><div><strong>${h}</strong><p>${p}</p></div></div>`).join('')}</div><div class="card"><h3>Safeguards and product validation</h3>${[['Upfront funding','A developer reserves the full reward pool plus the disclosed platform fee when publishing. Individual rewards cannot be changed after acceptance.'],['Independent enforcement','Objective checklist and platform-led abuse checks determine payout. A developer may flag suspected fraud for independent review, not stop payment by disagreement.'],['Protect recommendation signals','Compensated test sessions are labeled and excluded from organic ranking and creator reward signals, rather than counted as organic engagement.'],['A controlled pilot','Interview developers and testers. Compare task completion, report specificity, time to first reproducible finding, developer iteration time, and publish rate against current beta workflows.'],['Financial discipline','The example 10% marketplace fee is hypothetical. Robux transfers alone are not new platform revenue; measure incremental purchases, spending and developer adoption.']].map(([h,p])=>`<div class="feature-line"><span class="feature-icon">${ico('shield')}</span><div><strong>${h}</strong><p>${p}</p></div></div>`).join('')}</div></div><div class="tip warn" style="margin-top:18px">This is an independent interactive concept. The demo verifies only form completeness, not actual gameplay or fraud. All sample games, payouts and analytics are illustrative. No Roblox account or currency is connected.</div>`}
function modalContent(){if(!modal)return '';if(modal.kind==='flag'){const a=state.assignments.find(x=>x.id===modal.id);return `<h2>Flag this report for independent review</h2><p>Developers cannot reverse a qualifying payout or reject negative feedback. Use this only to report suspected duplicate, fabricated, or mismatched testing evidence.</p><form id="flagForm"><label class="label" for="flagType">Reason for review</label><select class="input" id="flagType" required><option value="Suspected duplicate evidence">Suspected duplicate evidence</option><option value="Evidence does not match the specified game or device">Evidence does not match the specified game or device</option><option value="Suspected fabricated test">Suspected fabricated test</option></select><label class="label" for="flagReason" style="margin-top:14px">Specific reason (25+ characters)</label><textarea id="flagReason" required minlength="25" placeholder="Identify the conflicting task evidence. Disagreement with a review is not a valid reason."></textarea><div class="modal-actions"><button type="button" class="btn white" data-action="closeModal">Cancel</button><button type="submit" class="btn primary">Submit flag for independent review</button></div></form>`}if(modal.kind==='assignment'){const a=state.assignments.find(x=>x.id===modal.id),c=getCamp(a.campaignId);return `<h2>${esc(c.title)}</h2><span class="pill ${a.status==='approved'?'green':'orange'}">${a.status==='approved'?'Reward released':a.status}</span>${a.feedback?`<div class="review-block"><strong>What worked</strong><p>${esc(a.feedback.worked||'Not specified')}</p><strong>Friction point</strong><p>${esc(a.feedback.stuck)}</p><strong>Recommendation</strong><p>${esc(a.feedback.improve)}</p>${a.feedback.taskLogs?.length?a.feedback.taskLogs.map((t,i)=>`<strong>Task ${i+1}: ${esc(t.result)}</strong><p>${esc(t.detail)}</p>`).join(''):''}</div>`:'<p>Feedback not submitted yet.</p>'}<div class="modal-actions"><button class="btn primary" data-action="closeModal">Done</button></div>`}return ''}
function renderModal(){return `<div class="modal-bg" data-action="modalBackdrop"><div class="modal" role="dialog" aria-modal="true">${modalContent()}</div></div>`}
function render(){let v={overview,games,campaigns:campaignList,campaign:campaignDetail,create:wizard,insights,economics,opportunities,opportunity:opportunityDetail,assignments:assignmentList,feedback:feedbackForm,earnings,strategy}[page]||overview;shell(v());document.title=`${[...developerNav,...playerNav,...sharedNav].find(x=>x[0]===page)?.[1]||'Creator Launchpad'} ,  Creator Launchpad`}
function captureWizard(){if(wizardStep===1){draft.gameId=document.getElementById('gameId').value;draft.title=document.getElementById('testTitle').value.trim();draft.objective=document.getElementById('objective').value;draft.description=document.getElementById('description').value.trim();draft.tasks=document.getElementById('tasks').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!draft.title||draft.description.length<15||draft.tasks.length<2){toast('Enter a title, a description of at least 15 characters, and at least two specific testing tasks.');return false}}else if(wizardStep===2){draft.devices=[...document.querySelectorAll('input[name="d"]:checked')].map(x=>x.value);draft.audience=document.getElementById('audience').value;draft.slots=Number(document.getElementById('slots').value);draft.reward=Number(document.getElementById('reward').value);draft.minutes=Number(document.getElementById('minutes').value);if(!draft.devices.length||draft.slots<2||draft.slots>30||draft.reward<10||draft.reward>10000||draft.minutes<5||draft.minutes>120){toast('Choose a device and valid tester, duration, and reward values.');return false}}return true}
function createCampaign(){let id='cp'+Date.now();const c={...draft,id,created:new Date().toISOString().slice(0,10),status:'Active',tasks:[...draft.tasks],devices:[...draft.devices]};state.campaigns.unshift(c);persist();draft={gameId:'midnight',objective:'First-time onboarding',title:'',description:'',tasks:['Play through the opening five minutes','Identify any confusing instructions','Suggest one improvement'],devices:['Desktop','Mobile'],audience:'New to genre',slots:6,reward:90,minutes:15};selectedCampaign=id;navTo('campaign',id);toast('Demo campaign funded and published. The fixed reward is now reserved for all tester slots.')}
function updateEstimate(){if(page!=='create'||wizardStep!==2)return;let slots=Number(document.getElementById('slots')?.value)||0,reward=Number(document.getElementById('reward')?.value)||0;document.getElementById('estimate-slots').textContent=slots;document.getElementById('estimate-reward').textContent=money(reward);document.getElementById('estimate-total').textContent=money(Math.round(slots*reward*1.1))}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-nav],[data-action],[data-role]');if(!btn)return;if(btn.dataset.role && !btn.dataset.nav){setRole(btn.dataset.role);return}if(btn.dataset.role&&btn.dataset.nav)role=btn.dataset.role;if(btn.dataset.nav){const p=btn.dataset.nav,id=btn.dataset.id;if(p==='opportunity'||p==='campaign')selectedCampaign=id;navTo(p,id);return}const action=btn.dataset.action,id=btn.dataset.id;if(action==='menu'){mobileMenu=!mobileMenu;render()}if(action==='reset'){if(confirm('Reset all simulated campaigns, assignments, and balances to the original demo data?')){state=JSON.parse(JSON.stringify(SEED));persist();role='developer';page='overview';render();toast('Demo restored to sample data.')}}if(action==='gameCreate'){draft.gameId=id;navTo('create')}if(action==='wizardBack'){if(wizardStep===1){navTo('overview')}else{wizardStep--;render()}}if(action==='wizardNext'){if(wizardStep<3){if(!captureWizard())return;wizardStep++;render();scrollTo({top:0,behavior:'smooth'})}else createCampaign()}if(action==='accept'){const c=getCamp(id);if(!c||available(c)<=0){toast('All testing spots have been filled.');return}if(playerAssignments().some(a=>a.campaignId===id)){toast('You already joined this playtest.');return}state.assignments.push({id:'a'+Date.now(),campaignId:id,playerId:'you',name:'You',device:c.devices[0],status:'accepted',created:new Date().toISOString().slice(0,10),feedback:null});persist();navTo('assignments');toast('Playtest accepted. Open the assignment to submit feedback.')}if(action==='feedback'){selectedAssignment=id;navTo('feedback')}if(action==='flagSubmission'){if(state.flags[id]){toast('This report has already been flagged.');return}modal={kind:'flag',id};render()}if(action==='assignmentDetails'){modal={kind:'assignment',id};render()}if(action==='closeModal'){modal=null;render()}if(action==='modalBackdrop'&&e.target===btn){modal=null;render()}if(action==='clearFilters'){search='';deviceFilter='All devices';genreFilter='All genres';render()}});
document.addEventListener('submit',e=>{if(e.target.id==='feedbackForm'){e.preventDefault();const a=state.assignments.find(a=>a.id===selectedAssignment);if(!a)return;const c=getCamp(a.campaignId);const taskLogs=c.tasks.map((task,i)=>({task,result:document.getElementById('result'+i).value,detail:document.getElementById('evidence'+i).value.trim()}));const stuck=document.getElementById('stuck').value.trim(),improve=document.getElementById('improve').value.trim(),worked=document.getElementById('worked').value.trim();if(taskLogs.some(t=>!['Completed','Blocked'].includes(t.result)||t.detail.length<25)||stuck.length<25||improve.length<25){toast('Complete every task log with 25+ characters, plus the observation and recommendation.');return}if(new Set([...taskLogs.map(t=>t.detail),stuck,improve].map(x=>x.toLowerCase())).size!==taskLogs.length+2){toast('Each response must describe a distinct observation, not duplicate another field.');return}a.feedback={taskLogs,worked,stuck,improve,rating:Number(document.getElementById('rating').value)||null};a.device=document.getElementById('feedbackDevice').value;a.status='approved';a.created=new Date().toISOString().slice(0,10);delete state.revisionNotes[a.id];persist();navTo('assignments');toast('Required fields completed. '+money(c.reward)+' credited in this simulation; no real payment occurred.')}if(e.target.id==='flagForm'){e.preventDefault();const reason=document.getElementById('flagReason').value.trim();if(reason.length<25){toast('Give a specific reason of at least 25 characters.');return}state.flags[modal.id]={type:document.getElementById('flagType').value,reason,created:new Date().toISOString().slice(0,10)};persist();modal=null;render();toast('Flag recorded for independent review in this demo. The developer cannot reverse the reward.')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const cursor=e.target.selectionStart;render();const el=document.getElementById('search');if(el){el.focus();el.setSelectionRange(cursor,cursor)}}if(['slots','reward'].includes(e.target.id))updateEstimate()});document.addEventListener('change',e=>{if(e.target.id==='deviceFilter'){deviceFilter=e.target.value;render()}if(e.target.id==='genreFilter'){genreFilter=e.target.value;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});render();


</script></body>
</html>
